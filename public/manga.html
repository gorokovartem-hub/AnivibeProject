<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Манга</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #0a0b14;
            color: #e4e7f0;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #ff6b9d;
        }
        .logo i { margin-right: 10px; }
        
        .nav {
            display: flex;
            gap: 12px;
        }
        .nav a {
            color: #5a6080;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 20px;
            transition: 0.3s;
            font-size: 14px;
        }
        .nav a:hover { background: #1a1c2e; color: #e4e7f0; }
        .nav a.active {
            background: #ff6b9d;
            color: #0a0b14;
            font-weight: 600;
        }
        
        .count {
            color: #5a6080;
            font-size: 14px;
        }
        .count span { color: #e4e7f0; font-weight: 600; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
            min-height: 400px;
        }
        
        .card {
            background: #12131e;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #1a1c2e;
            transition: 0.3s;
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-6px);
            border-color: #ff6b9d;
            box-shadow: 0 8px 30px rgba(255, 107, 157, 0.15);
        }
        .image {
            width: 100%;
            aspect-ratio: 2/3;
            background: #1a1c2e;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .image .placeholder {
            color: #3a3f5c;
            text-align: center;
        }
        .image .placeholder i { font-size: 36px; display: block; margin-bottom: 8px; }
        .info { padding: 14px; }
        .info h3 {
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 600;
        }
        .info .meta {
            font-size: 12px;
            color: #5a6080;
            margin-top: 4px;
        }
        
        .loading {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #5a6080;
        }
        .loading i {
            font-size: 40px;
            color: #ff6b9d;
            margin-bottom: 12px;
            display: block;
        }
        
        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #5a6080;
        }
        .empty i { font-size: 50px; color: #2a2f48; margin-bottom: 16px; display: block; }
        
        .footer {
            margin-top: 40px;
            padding: 20px 0;
            border-top: 1px solid #1a1c2e;
            text-align: center;
            color: #3a3f5c;
            font-size: 13px;
        }
        
        @media (max-width: 600px) {
            .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
            .logo { font-size: 18px; }
            .nav a { font-size: 12px; padding: 6px 12px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo"><i class="fas fa-book-open"></i> Манга</div>
        <div class="nav">
            <a href="/">Главная</a>
            <a href="/manga.html" class="active">Манга</a>
        </div>
        <div class="count">Всего: <span id="count">0</span></div>
    </div>
    
    <div id="grid" class="grid">
        <div class="loading">
            <i class="fas fa-spinner fa-spin"></i>
            Загрузка манги...
        </div>
    </div>
    
    <div class="footer">
        <i class="fas fa-heart" style="color:#ff6b9d;"></i> Картинки из MangaDex
    </div>
</div>

<script>
// ============================================================
// ЗАГРУЗКА КАРТИНОК ИЗ LOG.JSON
// ============================================================

async function loadManga() {
    try {
        const response = await fetch('/api/images');
        const data = await response.json();
        
        console.log('📸 Загружено картинок:', data.data?.length || 0);
        
        const grid = document.getElementById('grid');
        const countSpan = document.getElementById('count');
        
        if (data.success && data.data && data.data.length > 0) {
            grid.innerHTML = '';
            countSpan.textContent = data.data.length;
            
            data.data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                
                const imgPath = '/' + item.path.replace(/\\/g, '/');
                const name = item.path.split('/').pop().replace('.webp', '');
                
                card.innerHTML = `
                    <div class="image">
                        <img src="${imgPath}" alt="${name}" loading="lazy" 
                             onerror="this.parentElement.innerHTML='<div class=\\'placeholder\\'><i class=\\'fas fa-image\\'></i><span>${name}</span></div>'">
                    </div>
                    <div class="info">
                        <h3 title="${name}">${name}</h3>
                        <div class="meta">WebP · сжато</div>
                    </div>
                `;
                
                card.addEventListener('click', () => {
                    window.open(imgPath, '_blank');
                });
                
                grid.appendChild(card);
            });
        } else {
            grid.innerHTML = `
                <div class="empty">
                    <i class="fas fa-image"></i>
                    Нет картинок<br>
                    <span style="font-size:13px;color:#3a3f5c;">Запустите auto-convert.js для скачивания</span>
                </div>
            `;
            countSpan.textContent = '0';
        }
    } catch (error) {
        console.error('❌ Ошибка:', error);
        document.getElementById('grid').innerHTML = `
            <div class="empty">
                <i class="fas fa-exclamation-triangle"></i>
                Ошибка загрузки: ${error.message}
            </div>
        `;
    }
}

// Загружаем картинки при открытии страницы
document.addEventListener('DOMContentLoaded', loadManga);
</script>

</body>
</html>
